name: Build ESP8266 Deauther

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          mkdir -p ~/arduino-esp8266
          cd ~/arduino-esp8266
          wget https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz
          tar -xzf arduino-cli_latest_Linux_64bit.tar.gz
          sudo mv arduino-cli /usr/local/bin/

      - name: Install ESP8266 Platform
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Install Dependencies
        run: |
          arduino-cli lib install "ESP8266WiFi"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "ESPAsyncTCP"

      - name: Compile Firmware
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:d1_mini DeautherX.ino

      - name: Upload Compiled Firmware
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: DeautherX.ino.bin
